    <style>:root {
  --paper: #fbfaf8;
  --surface: #fffefa;

}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
a { color: inherit; text-decoration: none; }
.workspace-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; padding: 25px 15px; border-right: 1px solid var(--line); background: #f7f6f3; }
.identity { display: flex; align-items: center; gap: 11px; padding: 2px 8px 29px; }
.avatar { display: grid; place-items: center; width: 36px; height: 36px; background: var(--sage-pale); color: var(--sage); border-radius: 9px; font-size: 20px; font-weight: 700; }
.identity div { display: grid; gap: 3px; }.identity strong { font-size: 14px; }.identity div > span { color: var(--muted); font-size: 12px; }
.side-heading { padding: 10px 9px 8px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.sidebar nav { display: grid; gap: 3px; }.nav-link { display: flex; gap: 11px; align-items: center; width: 100%; padding: 10px 9px; border: 0; border-radius: 6px; background: transparent; text-align: left; color: #55524d; cursor: pointer; }.nav-link:hover { background: #eeece8; }.nav-link.is-active { background: var(--sage-pale); color: #526d5a; font-weight: 550; }.nav-link span:first-child { width: 16px; text-align: center; font-size: 15px; }
.sidebar-note { position: absolute; right: 19px; bottom: 24px; left: 22px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #79a280; }
.main-content { min-width: 0; }.topbar { display: flex; justify-content: space-between; align-items: center; height: 57px; padding: 0 39px; border-bottom: 1px solid var(--line); font-size: 13px; }.quiet { color: var(--muted); }.content-frame { width: min(1060px, calc(100% - 96px)); margin: 52px auto 76px; }.page-heading > p { margin: 0 0 10px; color: var(--muted); }.page-heading h1 { margin: 0 0 10px; font-size: 36px; line-height: 1.2; letter-spacing: -.04em; font-weight: 620; }.page-heading h1 span { color: var(--sage); }
.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; margin: 35px 0 34px; }.metric-card { display: grid; gap: 9px; min-height: 121px; padding: 18px 19px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }.metric-card > span { color: #69665f; font-size: 12px; }.metric-card strong { font-size: 29px; font-weight: 620; }.metric-card small { color: var(--muted); font-size: 11px; }
.panel { padding: 22px 22px 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }.panel-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }.panel-heading h2 { margin: 0 0 5px; font-size: 16px; }.panel-heading p { margin: 0; color: var(--muted); font-size: 12px; }.panel-heading input { width: 227px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; outline: none; }.panel-heading input:focus { border-color: #b3c1b2; }
.job-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) 130px 94px; gap: 13px; align-items: center; min-height: 75px; border-top: 1px solid #f0eee9; }.company-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid #eceae5; border-radius: 7px; color: #69665f; background: #faf9f7; }.job-main, .job-meta { display: grid; gap: 5px; min-width: 0; }.job-main > strong { display: flex; gap: 8px; align-items: center; font-size: 13px; }.job-main > span, .job-meta span { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }.priority { padding: 1px 5px; border-radius: 4px; font-size: 10px; }.priority-s { color: #916239; background: #f7eee2; }.priority-a { color: #587760; background: var(--sage-pale); }.priority-b { color: #73716c; background: #efeeeb; }.link-button { color: var(--sage); font-size: 12px; }.empty-state { padding: 38px 0; color: var(--muted); text-align: center; }

@media (max-width: 850px) { .workspace-shell { grid-template-columns: 68px minmax(0,1fr); }.sidebar { padding: 23px 11px; }.identity { justify-content: center; padding: 0 0 26px; }.identity div,.side-heading,.nav-link span:nth-child(2),.sidebar-note { display: none; }.nav-link { justify-content: center; }.topbar { padding: 0 19px; }.content-frame { width: calc(100% - 42px); }.metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }.quiet { display: none; }.job-row { grid-template-columns: 34px minmax(0,1fr) 83px; }.job-meta { display: none; } }
@media (max-width: 540px) { .workspace-shell { grid-template-columns: 52px minmax(0,1fr); }.sidebar { padding: 18px 7px; }.avatar { width: 32px; height: 32px; }.content-frame { width: calc(100% - 30px); margin-top: 31px; }.page-heading h1 { font-size: 28px; }.metric-grid { gap: 9px; }.metric-card { min-height: 105px; padding: 14px; }.panel { padding: 17px 12px 3px; }.panel-heading { display: grid; gap: 12px; }.panel-heading input { width: 100%; }.job-row { grid-template-columns: 30px minmax(0,1fr); gap: 9px; }.link-button { display: none; } }

/* Product workspace: navigation, collections, forms, and all six workflows. */
.workspace-shell { background: #fff; }
.sidebar { position: fixed; z-index: 3; inset: 0 auto 0 0; width: 248px; background: #faf9f7; }

const OLD_BATCH = /(?:^|\D)(?:202[0-6])(?:届|校园|校招|秋招|春招|\D|$)/;

function cleanText(value) {
  return String(value || "")
    .replace(/<script\b[\s\S]*?<\/script>/gi, " ")
    .replace(/<style\b[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;|&#160;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;|&#34;/gi, '"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">")
    .replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(Number(code)))
    .replace(/\s+/g, " ")

function absoluteUrl(value, baseUrl) {
  try {
    const result = new URL(String(value || ""), baseUrl);
    if (!/^https?:$/.test(result.protocol)) return "";
    result.hash = "";
    return result.href;
  } catch {
    return "";
  }
}

function isRelevantTitle(title) {
  const text = cleanText(title);
  if (text.length < 5 || text.length > 140 || GENERIC.test(text)) return false;
  if (OLD_BATCH.test(text) && !/2027/.test(text)) return false;
  return RELEVANT.test(text);
}

function normalizeDeadline(text) {
  const match = String(text || "").match(/(20\d{2})[年./-](\d{1,2})[月./-](\d{1,2})日?/);
  if (!match) return "";
  const month = match[2].padStart(2, "0");
  const day = match[3].padStart(2, "0");
  return `${match[1]}-${month}-${day}`;
}

function locationText(value) {
  if (!value) return "";
  if (typeof value === "string") return cleanText(value);
  if (Array.isArray(value)) return value.map(locationText).filter(Boolean).join(" / ");

  }

}

    eligibility: "需人工确认届别与学历要求",
    salary: "官网未披露",
    requirements: cleanText(extra.requirements) || "请打开岗位链接核对岗位职责与任职要求",
    officialUrl: cleanUrl,
    sourceUrl: source.officialUrl,
    priority: source.priority || "B",
    reviewState: "待确认",
    notes: "由后台自动检索公开招聘网页发现；请确认是否面向2027届、截止日期及能力要求。",
  };
}

function visitJson(value, source, baseUrl, output) {
  if (!value) return;
  if (Array.isArray(value)) {
    value.forEach((item) => visitJson(item, source, baseUrl, output));
    return;
  }
  if (typeof value !== "object") return;
  const type = String(value["@type"] || value.type || "");
  const title = value.title || value.name || value.jobTitle || value.positionName;
  const url = value.url || value.applyUrl || value.jobUrl || value.positionUrl;
  if (/JobPosting|Position|Job/i.test(type) || (title && url)) {
    const item = candidate(source, title, absoluteUrl(url, baseUrl), {
      location: value.jobLocation || value.location,
      deadline: value.validThrough || value.deadline,
      requirements: value.qualifications || value.description,
    });
    if (item) output.push(item);
  }
  Object.values(value).forEach((item) => {
    if (item && typeof item === "object") visitJson(item, source, baseUrl, output);
  });
}

function extractCandidates(html, source, baseUrl) {
  const output = [];
  const jsonLd = /<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  let match;
  while ((match = jsonLd.exec(html)) !== null) {
    try {
      visitJson(JSON.parse(match[1]), source, baseUrl, output);
    } catch {
      // Ignore invalid structured data and continue with links.
    }
  }

  const anchor = /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;
  while ((match = anchor.exec(html)) !== null && output.length < 24) {
    const item = candidate(source, cleanText(match[2]), absoluteUrl(match[1], baseUrl));
    if (item) output.push(item);
  }

  const seen = new Set();
  return output.filter((item) => {
    const key = `${item.company}|${item.title}|${item.officialUrl}`.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, 16);
}

async function responseText(response) {
  const bytes = new Uint8Array(await response.arrayBuffer());
  const header = response.headers.get("content-type") || "";
  const head = new TextDecoder("latin1").decode(bytes.slice(0, 4096));
  const charset = `${header} ${head}`.match(/charset\s*=\s*["']?([\w-]+)/i)?.[1]?.toLowerCase();
  const encoding = charset && /gbk|gb2312|gb18030/.test(charset) ? "gb18030" : "utf-8";
  try {
    return new TextDecoder(encoding).decode(bytes);
  } catch {
    return new TextDecoder("utf-8").decode(bytes);
  }
}

async function fetchSource(source) {
  const checkedAt = new Date().toISOString();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10_000);
  try {
    const response = await fetch(source.officialUrl, {
      redirect: "follow",
      signal: controller.signal,
      headers: {
        Accept: "text/html,application/xhtml+xml,application/json;q=0.8,*/*;q=0.5",
        "User-Agent": "qqi-2027-job-workbench/1.0 (+https://liqq651-design.github.io/)",
      },
    });
    if (!response.ok) {
      return { ...source, checkedAt, status: `访问受限（HTTP ${response.status}）`, ok: false, candidates: [] };
    }
    const text = (await responseText(response)).slice(0, 900_000);
    const contentType = response.headers.get("content-type") || "";
    const candidates = [];
    if (/json/i.test(contentType) || /^\s*[\[{]/.test(text)) {
      try {
        visitJson(JSON.parse(text), source, response.url || source.officialUrl, candidates);
      } catch {
        candidates.push(...extractCandidates(text, source, response.url || source.officialUrl));
      }
    } else {
      candidates.push(...extractCandidates(text, source, response.url || source.officialUrl));
    }
    return {
      ...source,
      checkedAt,
      status: candidates.length ? `发现 ${candidates.length} 条相关线索` : "网页可访问，未解析到新线索",
      ok: true,
      candidates,
    };
  } catch (error) {
    const message = error?.name === "AbortError" ? "访问超时" : "网页无法访问或需要登录";
    return { ...source, checkedAt, status: message, ok: false, candidates: [] };
  } finally {
    clearTimeout(timer);
  }
}

async function mapConcurrent(items, limit, worker) {
  const output = new Array(items.length);
  let cursor = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (cursor < items.length) {
      const index = cursor++;
      output[index] = await worker(items[index]);
    }
  }));
  return output;
}

function previousFeed() {
  try {
    return JSON.parse(fs.readFileSync(OUTPUT_PATH, "utf8"));
  } catch {
    return { candidates: [] };
  }
}

async function main() {
  const generatedAt = new Date().toISOString();
  const outcomes = await mapConcurrent(SOURCES, 8, fetchSource);
  const previous = previousFeed();
  const merged = new Map();
  for (const item of Array.isArray(previous.candidates) ? previous.candidates : []) {
    const firstSeenAt = item.firstSeenAt || item.lastSeenAt || generatedAt;
    const lastSeenAt = item.lastSeenAt || firstSeenAt;
    if (Date.now() - new Date(lastSeenAt).getTime() <= MAX_AGE_MS) {
      merged.set(item.id, { ...item, firstSeenAt, lastSeenAt });
    }
  }
  for (const outcome of outcomes) {
    for (const item of outcome.candidates) {
      const existing = merged.get(item.id);
      merged.set(item.id, {
        ...existing,
        ...item,
        firstSeenAt: existing?.firstSeenAt || generatedAt,
        lastSeenAt: generatedAt,
      });
    }
  }
  const candidates = [...merged.values()]
    .sort((a, b) => String(b.lastSeenAt).localeCompare(String(a.lastSeenAt)))
    .slice(0, 600);
  const successfulSources = outcomes.filter((item) => item.ok).length;
  const feed = {
    kind: "qqi-public-job-feed",
    version: 1,
    generatedAt,
    schedule: "about-every-2-hours",
    sourceCount: outcomes.length,
    successfulSources,
    blockedSources: outcomes.length - successfulSources,
    candidates,
    sources: outcomes.map(({ candidates: found, ...item }) => ({ ...item, candidatesFound: found.length })),
  };
  fs.writeFileSync(OUTPUT_PATH, `${JSON.stringify(feed, null, 2)}\n`, "utf8");
  console.log(`Checked ${outcomes.length} sources; ${successfulSources} reachable; ${candidates.length} retained candidates.`);
}

globalThis.__QQI_JOB_SCANNER__ = { cleanText, isRelevantTitle, extractCandidates, fetchSource };
if (!globalThis.__QQI_SCANNER_TEST__) {
  main().catch((error) => {
    console.error(error);
    process.exitCode = 1;
  });
}
