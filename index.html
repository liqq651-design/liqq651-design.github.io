const CAMPUS = /校招|校园招聘|秋招|应届|毕业生|graduate|campus|管理培训生|管培|培训生|trainee/i;
const CAMPUS_SOURCE = /(?:\/campus|campus[.-]|\/graduate|\/university|\/school|xiaozhao|campus-recruit)/i;
const EXCLUDED_TITLE = /实习|intern(?:ship)?\b|校园(?:大使|星探|合伙人|代表)|campus\s*(?:ambassador|recruiter)|社会招聘|社招|experienced\s+hire|(?:senior|principal|director|head\s+of)\b|business\s+development\s+manager|资深|高级(?:研究员|经理|工程师)|博士(?:优招|专项|专场|招聘|后)|ph\.?\s*d\.?\s*(?:only|required)|技能人才|技工|技术员|装配|操作员|关注方向|人才(?:库|储备)/i;
const EXPERIENCE = /(?:[2-9]|1\d|[两二三四五六七八九十])\s*(?:\+\s*)?年(?:以上)?(?:相关)?(?:工作)?经验|(?:[2-9]|1\d)\s*\+?\s*years?\s+(?:of\s+)?experience/i;
const DOCTORATE = /博士|ph\.?\s*d\.?|doctorate/i;
const MASTER_OR_BACHELOR = /本科|硕士|本硕|master|bachelor/i;

function cleanText(value) {
  return String(value || "")
    .replace(/<script\b[\s\S]*?<\/script>/gi, " ")
    .replace(/<style\b[\s\S]*?<\/style>/gi, " ")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;|&#160;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;|&#34;/gi, '"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">")
    .replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(Number(code)))
    .replace(/\s+/g, " ")
    .trim();
}

function absoluteUrl(value, baseUrl) {
  try {
    const result = new URL(String(value || ""), baseUrl);
    if (!/^https?:$/.test(result.protocol)) return "";
    result.hash = "";
    return result.href;
  } catch {
    return "";
  }
}

function isRelevantTitle(title) {
  const text = cleanText(title);
  if (text.length < 5 || text.length > 140 || GENERIC.test(text)) return false;
  if (EXCLUDED_TITLE.test(text)) return false;
  if (OLD_BATCH.test(text) && !/2027/.test(text)) return false;
  return RELEVANT.test(text);
}

function campusContext(html, source) {
  const visible = cleanText(html).slice(0, 80_000);
  const nearCampus = /(?:2027|27届)[\s\S]{0,55}(?:校招|校园招聘|秋招|应届|graduate|campus)|(?:校招|校园招聘|秋招|应届|graduate|campus)[\s\S]{0,55}(?:2027|27届)/i.test(visible);
  return {
    dedicatedSource: CAMPUS_SOURCE.test(source.officialUrl),
    pageHasCampusCampaign: nearCampus,
  };
}

function isFormalCampusCandidate(source, title, url, extra = {}, context = {}) {
  const cleanTitle = cleanText(title);
  const requirements = cleanText(extra.requirements);
  const employment = cleanText(extra.employmentType);
  if (!isRelevantTitle(cleanTitle) || !url) return false;
  if (/intern|part[_ -]?time|contract/i.test(employment)) return false;
  if (EXPERIENCE.test(requirements)) return false;
  if (DOCTORATE.test(`${cleanTitle} ${requirements}`) && !MASTER_OR_BACHELOR.test(`${cleanTitle} ${requirements}`)) return false;

  const candidateText = `${cleanTitle} ${requirements} ${url}`;
  const ownCohort = COHORT.test(candidateText);
  const ownCampus = CAMPUS.test(candidateText);
  const dedicatedSource = Boolean(context.dedicatedSource) || CAMPUS_SOURCE.test(source.officialUrl);
  const pageHasCampusCampaign = Boolean(context.pageHasCampusCampaign);

  return (ownCohort && (ownCampus || dedicatedSource || pageHasCampusCampaign))
    || (pageHasCampusCampaign && dedicatedSource && ownCampus);
}

function normalizeDeadline(text) {
  const match = String(text || "").match(/(20\d{2})[年./-](\d{1,2})[月./-](\d{1,2})日?/);
  if (!match) return "";
  const month = match[2].padStart(2, "0");
  const day = match[3].padStart(2, "0");
  return `${match[1]}-${month}-${day}`;
}

function locationText(value) {
  if (!value) return "";
  if (typeof value === "string") return cleanText(value);
  if (Array.isArray(value)) return value.map(locationText).filter(Boolean).join(" / ");
  if (typeof value === "object") {
    return locationText(value.address || value.name || value.addressLocality || value.jobLocation);
  }
  return "";
}

function candidate(source, title, url, extra = {}, context = {}) {
  const cleanTitle = cleanText(title);
  const cleanUrl = absoluteUrl(url, source.officialUrl);
  if (!isFormalCampusCandidate(source, cleanTitle, cleanUrl, extra, context)) return null;
  const requirements = cleanText(extra.requirements);
  const signature = `${source.name}|${cleanTitle}|${cleanUrl}`.toLowerCase();
  return {
    id: `auto-${crypto.createHash("sha256").update(signature).digest("hex").slice(0, 20)}`,
    company: source.name,
    title: cleanTitle,
    track: RESEARCH_BD.test(`${cleanTitle} ${requirements}`) ? "科研BD / 商务管培" : source.track,
    location: locationText(extra.location) || source.cities || "待确认",
    recruitmentStatus: "校招待确认",
    deadline: normalizeDeadline(extra.deadline || cleanTitle),
    eligibility: "2027届正式校园招聘；请核对本科/硕士申请资格",
    salary: "官网未披露",
    requirements: requirements || "请打开岗位链接核对岗位职责与任职要求",
    officialUrl: cleanUrl,
    sourceUrl: source.officialUrl,
    priority: source.priority || "B",
    reviewState: "待确认",
    notes: "已过滤实习、社招、校园星探和博士专项；请打开校招原文再次核对正式编制、硕士资格及截止日期。",
  };
}

function visitJson(value, source, baseUrl, output, context = {}) {
  if (!value) return;
  if (Array.isArray(value)) {
    value.forEach((item) => visitJson(item, source, baseUrl, output, context));
    return;
  }
  if (typeof value !== "object") return;
  const type = String(value["@type"] || value.type || "");
  const title = value.title || value.name || value.jobTitle || value.positionName;
  const url = value.url || value.applyUrl || value.jobUrl || value.positionUrl;
  if (/JobPosting|Position|Job/i.test(type) || (title && url)) {
    const item = candidate(source, title, absoluteUrl(url, baseUrl), {
      location: value.jobLocation || value.location,
      deadline: value.validThrough || value.deadline,
      requirements: value.qualifications || value.description,
      employmentType: value.employmentType || value.jobType,
    }, context);
    if (item) output.push(item);
  }
  Object.values(value).forEach((item) => {
    if (item && typeof item === "object") visitJson(item, source, baseUrl, output, context);
  });
}

function extractCandidates(html, source, baseUrl) {
  const output = [];
  const context = campusContext(html, source);
  const jsonLd = /<script\b[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  let match;
  while ((match = jsonLd.exec(html)) !== null) {
    try {
      visitJson(JSON.parse(match[1]), source, baseUrl, output, context);
    } catch {
      // Ignore invalid structured data and continue with links.
    }
  }

  const anchor = /<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi;
  while ((match = anchor.exec(html)) !== null && output.length < 24) {
    const item = candidate(source, cleanText(match[2]), absoluteUrl(match[1], baseUrl), {}, context);
    if (item) output.push(item);
  }

  const seen = new Set();
  return output.filter((item) => {
    const key = `${item.company}|${item.title}|${item.officialUrl}`.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, 16);
}

async function responseText(response) {
  const bytes = new Uint8Array(await response.arrayBuffer());
  const header = response.headers.get("content-type") || "";
  const head = new TextDecoder("latin1").decode(bytes.slice(0, 4096));
  const charset = `${header} ${head}`.match(/charset\s*=\s*["']?([\w-]+)/i)?.[1]?.toLowerCase();
  const encoding = charset && /gbk|gb2312|gb18030/.test(charset) ? "gb18030" : "utf-8";
  try {
    return new TextDecoder(encoding).decode(bytes);
  } catch {
    return new TextDecoder("utf-8").decode(bytes);
  }
}

async function fetchSource(source) {
  const checkedAt = new Date().toISOString();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10_000);
  try {
    const response = await fetch(source.officialUrl, {
      redirect: "follow",
      signal: controller.signal,
      headers: {
        Accept: "text/html,application/xhtml+xml,application/json;q=0.8,*/*;q=0.5",
        "User-Agent": "qqi-2027-job-workbench/1.0 (+https://liqq651-design.github.io/)",
      },
    });
    if (!response.ok) {
      return { ...source, checkedAt, status: `访问受限（HTTP ${response.status}）`, ok: false, candidates: [] };
    }
    const text = (await responseText(response)).slice(0, 900_000);
    const contentType = response.headers.get("content-type") || "";
    const candidates = [];
    if (/json/i.test(contentType) || /^\s*[\[{]/.test(text)) {
      try {
        visitJson(JSON.parse(text), source, response.url || source.officialUrl, candidates, campusContext(text, source));
      } catch {
        candidates.push(...extractCandidates(text, source, response.url || source.officialUrl));
      }
    } else {
      candidates.push(...extractCandidates(text, source, response.url || source.officialUrl));
    }
    return {
      ...source,
      checkedAt,
      status: candidates.length ? `发现 ${candidates.length} 条2027正式校招线索` : "网页可访问，未发现符合条件的正式校招",
      ok: true,
      candidates,
    };
  } catch (error) {
    const message = error?.name === "AbortError" ? "访问超时" : "网页无法访问或需要登录";
    return { ...source, checkedAt, status: message, ok: false, candidates: [] };
  } finally {
    clearTimeout(timer);
  }
}

async function mapConcurrent(items, limit, worker) {
  const output = new Array(items.length);
  let cursor = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (cursor < items.length) {
      const index = cursor++;
      output[index] = await worker(items[index]);
    }
  }));
  return output;
}

function previousFeed() {
  try {
    return JSON.parse(fs.readFileSync(OUTPUT_PATH, "utf8"));
  } catch {
    return { candidates: [] };
  }
}

async function main() {
  const generatedAt = new Date().toISOString();
  const outcomes = await mapConcurrent(SOURCES, 8, fetchSource);
  const previous = previousFeed();
  const merged = new Map();
  for (const item of Array.isArray(previous.candidates) ? previous.candidates : []) {
    const source = SOURCES.find((entry) => entry.name === item.company);
    if (!source || !isFormalCampusCandidate(source, item.title, item.officialUrl, { requirements: item.requirements }, { pageHasCampusCampaign: CAMPUS.test(`${item.title} ${item.eligibility || ""}`) })) continue;
    const firstSeenAt = item.firstSeenAt || item.lastSeenAt || generatedAt;
    const lastSeenAt = item.lastSeenAt || firstSeenAt;
    if (Date.now() - new Date(lastSeenAt).getTime() <= MAX_AGE_MS) {
      merged.set(item.id, { ...item, firstSeenAt, lastSeenAt });
    }
  }
  for (const outcome of outcomes) {
    for (const item of outcome.candidates) {
      const existing = merged.get(item.id);
      merged.set(item.id, {
        ...existing,
        ...item,
        firstSeenAt: existing?.firstSeenAt || generatedAt,
        lastSeenAt: generatedAt,
      });
    }
  }
  const candidates = [...merged.values()]
    .sort((a, b) => String(b.lastSeenAt).localeCompare(String(a.lastSeenAt)))
    .slice(0, 600);
  const successfulSources = outcomes.filter((item) => item.ok).length;
  const feed = {
    kind: "qqi-public-job-feed",
    version: 1,
    generatedAt,
    schedule: "about-every-2-hours",
    sourceCount: outcomes.length,
    successfulSources,
    blockedSources: outcomes.length - successfulSources,
    candidates,
    sources: outcomes.map(({ candidates: found, ...item }) => ({ ...item, candidatesFound: found.length })),
  };
  fs.writeFileSync(OUTPUT_PATH, `${JSON.stringify(feed, null, 2)}\n`, "utf8");
  console.log(`Checked ${outcomes.length} sources; ${successfulSources} reachable; ${candidates.length} retained candidates.`);
}

    process.exitCode = 1;
  });
}

      (() => {
        const storageKey = "qqi-2027-autumn-workbench-v1";
        const migrationVersion = "msd-danaher-2026-08-26-v1";
        try {
          const workspace = JSON.parse(localStorage.getItem(storageKey) || "null");
          if (!workspace || !Array.isArray(workspace.companies)) return;

          const oldMsd = workspace.companies.find((company) =>
            company.id === "company-030" || company.id === "focus-msd" || String(company.name || "").includes("默沙东")
          );
          const oldDanaher = workspace.companies.find((company) =>
            company.id === "focus-danaher" || String(company.name || "").includes("丹纳赫") || /danaher/i.test(String(company.name || ""))
          );
          const msd = {
            ...oldMsd,
            id: "focus-msd",
            track: "科研BD / 商务管培",
            name: "MSD 默沙东",
            cities: "上海 / 北京 / 杭州",
            status: "官方学生招聘入口有效；2027正式校招岗位待发布或核验",

            officialUrl: "https://campus.51job.com/msd/",
            priority: "S",
            frequency: "每周",
            notes: "重点盯2027届正式校招：科研合作、商业/市场、医学事务与管培；仅收录硕士可投全职，普通医药代表不作为核心目标。",
            verifiedAt: "2026-08-26",
            lastCheckedAt: "2026-08-26",
          };
          const danaher = {
            ...oldDanaher,
            id: "focus-danaher",
            track: "科研BD / 商务管培",
            name: "Danaher 丹纳赫（含运营公司）",
            cities: "上海 / 苏州 / 全国",
            status: "官方职业入口有效；2027正式校招岗位待核验",
            keywords: "科研BD / 技术销售 / 产品管理 / 商务管培 / Cytiva / 贝克曼库尔特 / 徕卡 / SCIEX / Molecular Devices / Abcam",
            officialUrl: "https://jobs.danaher.com/global/en",
            priority: "S",
            frequency: "每周",
            notes: "集团岗位常以运营公司品牌发布；重点检索生命科学、诊断和生物技术业务的科研客户、解决方案、产品及商业岗位。当前只加入监测，不把2026暑期实习混入正式校招岗位库。",
            verifiedAt: "2026-08-26",
            lastCheckedAt: "2026-08-26",
          };

          const previousVersion = workspace.settings?.focus_companies_version;
          workspace.companies = workspace.companies.filter((company) =>
            !["company-030", "focus-msd", "focus-danaher"].includes(company.id) &&
            !String(company.name || "").includes("默沙东") &&
            !String(company.name || "").includes("丹纳赫") &&
            !/danaher/i.test(String(company.name || ""))
          );
          workspace.companies.unshift(msd, danaher);
          workspace.settings = {
            ...(workspace.settings || {}),
            focus_companies_version: migrationVersion,
          };
          localStorage.setItem(storageKey, JSON.stringify(workspace));
          if (previousVersion !== migrationVersion) window.location.reload();
        } catch (error) {
          console.warn("重点企业更新未完成：", error);
        }
      })();
    </script>
