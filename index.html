    <style>:root {
  --paper: #fbfaf8;
  --surface: #fffefa;
  --ink: #282724;
  --muted: #85827c;
  --line: #ebe9e4;

  --sage-pale: #eef3ed;
  --amber: #a97638;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
a { color: inherit; text-decoration: none; }
.workspace-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; padding: 25px 15px; border-right: 1px solid var(--line); background: #f7f6f3; }
.identity { display: flex; align-items: center; gap: 11px; padding: 2px 8px 29px; }
.avatar { display: grid; place-items: center; width: 36px; height: 36px; background: var(--sage-pale); color: var(--sage); border-radius: 9px; font-size: 20px; font-weight: 700; }
.identity div { display: grid; gap: 3px; }.identity strong { font-size: 14px; }.identity div > span { color: var(--muted); font-size: 12px; }
.side-heading { padding: 10px 9px 8px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
.sidebar nav { display: grid; gap: 3px; }.nav-link { display: flex; gap: 11px; align-items: center; width: 100%; padding: 10px 9px; border: 0; border-radius: 6px; background: transparent; text-align: left; color: #55524d; cursor: pointer; }.nav-link:hover { background: #eeece8; }.nav-link.is-active { background: var(--sage-pale); color: #526d5a; font-weight: 550; }.nav-link span:first-child { width: 16px; text-align: center; font-size: 15px; }
.sidebar-note { position: absolute; right: 19px; bottom: 24px; left: 22px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #79a280; }
.main-content { min-width: 0; }.topbar { display: flex; justify-content: space-between; align-items: center; height: 57px; padding: 0 39px; border-bottom: 1px solid var(--line); font-size: 13px; }.quiet { color: var(--muted); }.content-frame { width: min(1060px, calc(100% - 96px)); margin: 52px auto 76px; }.page-heading > p { margin: 0 0 10px; color: var(--muted); }.page-heading h1 { margin: 0 0 10px; font-size: 36px; line-height: 1.2; letter-spacing: -.04em; font-weight: 620; }.page-heading h1 span { color: var(--sage); }
.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; margin: 35px 0 34px; }.metric-card { display: grid; gap: 9px; min-height: 121px; padding: 18px 19px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }.metric-card > span { color: #69665f; font-size: 12px; }.metric-card strong { font-size: 29px; font-weight: 620; }.metric-card small { color: var(--muted); font-size: 11px; }
.panel { padding: 22px 22px 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }.panel-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }.panel-heading h2 { margin: 0 0 5px; font-size: 16px; }.panel-heading p { margin: 0; color: var(--muted); font-size: 12px; }.panel-heading input { width: 227px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; outline: none; }.panel-heading input:focus { border-color: #b3c1b2; }
.job-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) 130px 94px; gap: 13px; align-items: center; min-height: 75px; border-top: 1px solid #f0eee9; }.company-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid #eceae5; border-radius: 7px; color: #69665f; background: #faf9f7; }.job-main, .job-meta { display: grid; gap: 5px; min-width: 0; }.job-main > strong { display: flex; gap: 8px; align-items: center; font-size: 13px; }.job-main > span, .job-meta span { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }.priority { padding: 1px 5px; border-radius: 4px; font-size: 10px; }.priority-s { color: #916239; background: #f7eee2; }.priority-a { color: #587760; background: var(--sage-pale); }.priority-b { color: #73716c; background: #efeeeb; }.link-button { color: var(--sage); font-size: 12px; }.empty-state { padding: 38px 0; color: var(--muted); text-align: center; }

@media (max-width: 850px) { .workspace-shell { grid-template-columns: 68px minmax(0,1fr); }.sidebar { padding: 23px 11px; }.identity { justify-content: center; padding: 0 0 26px; }.identity div,.side-heading,.nav-link span:nth-child(2),.sidebar-note { display: none; }.nav-link { justify-content: center; }.topbar { padding: 0 19px; }.content-frame { width: calc(100% - 42px); }.metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }.quiet { display: none; }.job-row { grid-template-columns: 34px minmax(0,1fr) 83px; }.job-meta { display: none; } }
@media (max-width: 540px) { .workspace-shell { grid-template-columns: 52px minmax(0,1fr); }.sidebar { padding: 18px 7px; }.avatar { width: 32px; height: 32px; }.content-frame { width: calc(100% - 30px); margin-top: 31px; }.page-heading h1 { font-size: 28px; }.metric-grid { gap: 9px; }.metric-card { min-height: 105px; padding: 14px; }.panel { padding: 17px 12px 3px; }.panel-heading { display: grid; gap: 12px; }.panel-heading input { width: 100%; }.job-row { grid-template-columns: 30px minmax(0,1fr); gap: 9px; }.link-button { display: none; } }

/* Product workspace: navigation, collections, forms, and all six workflows. */
.workspace-shell { background: #fff; }
.sidebar { position: fixed; z-index: 3; inset: 0 auto 0 0; width: 248px; background: #faf9f7; }

.empty-card h3 { margin: 13px 0 7px; font-size: 14px; }
.empty-card p { max-width: 460px; margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.7; }
.error-banner { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding: 11px 13px; border: 1px solid #f0dbd3; border-radius: 7px; background: #fff7f4; color: #925b49; font-size: 12px; }
.error-banner button { border: 0; background: transparent; color: inherit; font-size: 17px; cursor: pointer; }
.toast { position: fixed; z-index: 12; right: 25px; bottom: 24px; max-width: 400px; padding: 12px 15px; border: 1px solid #dfe9df; border-radius: 8px; background: #f2f7f1; color: #496550; box-shadow: 0 10px 28px rgb(40 50 42 / 9%); font-size: 12px; }

.drawer { position: fixed; z-index: 6; inset: 0 0 0 auto; width: 372px; overflow-y: auto; padding: 19px 21px 30px; border-left: 1px solid var(--line); background: #fff; box-shadow: -9px 0 26px rgb(38 37 34 / 3%); }
.drawer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
.icon-button { display: inline-grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 6px; background: #f3f1ed; color: #6d6a63; font-size: 17px; cursor: pointer; }
.drawer > h2 { margin: 4px 0 13px; font-size: 20px; line-height: 1.5; }
.drawer-controls { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; margin-top: 22px; }
.drawer-controls label, .field-label, .editor-form > label, .form-grid > label { display: grid; gap: 6px; color: #737069; font-size: 11px; }
.drawer-controls select, .field-label select, .field-label input, .field-label textarea { width: 100%; }
.detail-grid { margin: 20px 0 0; }
.detail-grid > div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid #f0eee9; }
.detail-grid dt { color: #807d76; font-size: 10px; }
.detail-grid dd { margin: 0; color: #4f4c46; font-size: 11px; line-height: 1.6; }
.drawer-block { margin: 20px 0; }
.drawer-block h3 { margin: 0 0 7px; font-size: 12px; }
.drawer-block p { margin: 0; color: #68655f; font-size: 11px; line-height: 1.75; }
.drawer > .field-label { margin-top: 14px; }
.drawer-date-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.drawer-save, .drawer-link { width: 100%; margin-top: 12px; }
.drawer > .destructive { display: block; width: 100%; margin-top: 9px; text-align: center; }

.modal-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: rgb(37 35 31 / 26%); }
.modal-card { width: min(590px, 100%); max-height: min(88vh, 840px); overflow-y: auto; padding: 22px; border: 1px solid #e9e6df; border-radius: 12px; background: #fff; box-shadow: 0 24px 72px rgb(30 28 25 / 15%); }
.modal-heading { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
.modal-heading h2 { margin: 0 0 6px; font-size: 17px; }
.modal-heading p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
.editor-form { display: grid; gap: 13px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.editor-form input, .editor-form select, .editor-form textarea { width: 100%; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px; }
.upload-zone { position: relative; display: grid; min-height: 115px; place-content: center; justify-items: center; gap: 5px; border: 1px dashed #d9dfd8; border-radius: 8px; background: #f8faf7; cursor: pointer; }
.upload-zone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.upload-zone > span { color: #5d7964; font-size: 21px; }
.upload-zone > strong { color: #465a4b; font-size: 12px; }
.upload-zone > small { color: #81847e; font-size: 10px; }

@media (max-width: 1130px) {
  .content-frame { width: calc(100% - 68px); }
  .job-table-head, .job-table-row { grid-template-columns: 36px minmax(165px, 2fr) 90px minmax(84px, 1fr) 66px; gap: 8px; padding: 0 12px; }
  .job-table-head > :last-child, .job-table-row > :last-child { display: none; }
  .main-content.has-drawer { width: calc(100vw - 248px); }
}

@media (max-width: 850px) {
  .sidebar { width: 68px; }
  .main-content, .main-content.has-drawer { width: calc(100vw - 68px); margin-left: 68px; }
  .sidebar-preferences, .nav-count { display: none; }
  .content-frame { width: calc(100% - 40px); }
  .source-banner { display: grid; }
  .analytics-layout { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  .sidebar { width: 52px; }
  .main-content, .main-content.has-drawer { width: calc(100vw - 52px); margin-left: 52px; }
  .content-frame { width: calc(100% - 26px); }
  .page-heading-split { align-items: flex-start; flex-direction: column; }
  .metric-grid, .analytics-metrics { grid-template-columns: 1fr 1fr; }
  .reminder-metrics { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .reminder-metrics article { padding: 10px; }
  .reminder-metrics strong { font-size: 20px; }
  .job-table-head, .job-table-row { grid-template-columns: 26px minmax(120px, 1fr) 61px; gap: 7px; padding: 0 8px; }
  .job-table-head > :nth-child(3), .job-table-head > :nth-child(4), .job-table-row > :nth-child(3), .job-table-row > :nth-child(4) { display: none; }
  .overview-cards { grid-template-columns: 1fr; }
  .filter-row select { flex: 1; }
  .candidate-card, .candidate-actions { flex-direction: column; }
  .candidate-actions { flex-direction: row; flex-wrap: wrap; }
  .reminder-row { grid-template-columns: 78px minmax(0, 1fr); gap: 9px; padding: 0 10px; }
  .reminder-kind { display: none; }
  .drawer { width: min(100%, 390px); }
  .interview-notes, .form-grid { grid-template-columns: 1fr; }
}


.offline-toolbar { position: fixed; top: 10px; right: 25px; z-index: 8; display: flex; align-items: center; gap: 7px; padding: 0; }
.offline-status { padding-right: 5px; color: #627d69; font-size: 11px; white-space: nowrap; }
.offline-tool-button { min-height: 32px; padding: 0 10px; border: 1px solid #e8e5de; border-radius: 6px; background: #fff; color: #55534d; font-size: 11px; cursor: pointer; }
.offline-tool-button:hover { border-color: #bcc8bd; background: #f5f8f4; color: #45634e; }
.topbar { padding-right: 335px; }
@media (max-width: 980px) { .offline-status { display: none; } .offline-toolbar { right: 14px; } .topbar { padding-right: 215px; } }
@media (max-width: 650px) { .offline-toolbar { top: auto; right: 12px; bottom: 12px; padding: 7px; border: 1px solid #e8e5de; border-radius: 9px; background: rgba(255,255,255,.96); box-shadow: 0 5px 24px rgba(37,35,31,.1); } .topbar { padding-right: 19px; } .content-frame { padding-bottom: 62px; } }
